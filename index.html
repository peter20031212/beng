<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Loading...</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>

    <div class="bento-container" id="bento-grid">
        </div>

    <script>
        async function loadContent() {
            try {
                // 讀取 yml 檔案
                const response = await fetch('data.yml');
                const text = await response.text();
                const data = jsyaml.load(text);

                // 設定網頁標題變數
                document.title = data.site_title;
                document.getElementById('page-title').innerText = data.site_title;

                // 渲染 Bento 區塊
                const container = document.getElementById('bento-grid');
                container.innerHTML = `
                    <div class="card card-large">
                        <h1>${data.profile.name}</h1>
                        <p>${data.profile.intro}</p>
                    </div>
                    <div class="card card-small" style="background: #ffebd3;">
                        <h3>技能</h3>
                        ${data.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
                    </div>
                    <div class="card card-medium">
                        <h3>聯繫我</h3>
                        <p>${data.contact}</p>
                    </div>
                    <div class="card card-small">
                        <h3>社交連結</h3>
                        ${data.links.map(l => `<p><a href="${l.url}" style="color: var(--accent-red);">${l.title}</a></p>`).join('')}
                    </div>
                    `
<div class="card card-medium">
    <h3>${data.services.title}</h3>
    <div class="sub-items-container">
        ${data.services.items.map(item => `
            <div class="sub-item">${item}</div>
        `).join('')}
    </div>
</div>
`

                `;
            } catch (e) {
                console.error("讀取 YML 失敗:", e);
            }
        }
        loadContent();
    </script>
</body>
</html>
